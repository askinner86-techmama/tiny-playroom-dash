<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Tiny Playroom Dash</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="hud" class="hidden">
      <div class="hud-left">
        <div class="hud-chip">SCORE <span id="hudScore">0</span></div>
        <div class="hud-chip">BEST <span id="hudBest">0</span></div>
      </div>
      <button id="btnPause" class="icon-btn" type="button">II</button>
    </div>
    <div id="tipBanner" class="tip-banner hidden"></div>
    <div id="touchLayer" class="hidden">
      <button id="btnJump" class="touch-btn" type="button">JUMP</button>
      <button id="btnSlide" class="touch-btn" type="button">SLIDE</button>
    </div>
    <section id="screenMenu" class="panel">
      <div class="title-wrap">
        <p class="eyebrow">You've been shrunk to ant size</p>
        <h1>Tiny Playroom Dash</h1>
        <p class="tagline">Race across the giant playroom. Jump the toys. Grab the marbles.</p>
      </div>
      <p class="pick-label">Choose a runner</p>
      <div class="char-row">
        <button class="char-card selected" data-char="boy" type="button"><img alt="Alden" /><span>Alden</span></button>
        <button class="char-card" data-char="girl" type="button"><img alt="Katherine" /><span>Katherine</span></button>
      </div>
      <div class="btn-row">
        <button id="btnPlay" class="btn primary" type="button">Play</button>
        <button id="btnHow" class="btn ghost" type="button">How to Play</button>
        <button id="btnScores" class="btn ghost" type="button">Top 10</button>
      </div>
    </section>
    <section id="screenHow" class="panel hidden">
      <h2>How to Play</h2>
      <p id="howStep" class="pick-label">Tip 1 of 5</p>
      <div id="howBody" class="how-card"></div>
      <div class="btn-row">
        <button id="btnHowBack" class="btn ghost" type="button">Back</button>
        <button id="btnHowNext" class="btn primary" type="button">Next</button>
        <button id="btnPractice" class="btn ghost" type="button">Practice Run</button>
      </div>
    </section>
    <section id="screenScores" class="panel hidden">
      <h2>Top 10 Runners</h2>
      <ol id="scoreList" class="score-list"></ol>
      <button id="btnScoresBack" class="btn primary" type="button">Back</button>
    </section>
    <section id="screenPause" class="panel hidden">
      <h2>Paused</h2>
      <div class="btn-row">
        <button id="btnResume" class="btn primary" type="button">Resume</button>
        <button id="btnQuit" class="btn ghost" type="button">Quit</button>
      </div>
    </section>
    <section id="screenOver" class="panel hidden">
      <div class="sheet">
        <h2>Squished!</h2>
        <p class="over-score">Score <strong id="overScore">0</strong></p>
        <p id="overMsg" class="tagline"></p>
        <div id="initialsBox" class="hidden">
          <p class="pick-label">New Top 10 — 3 initials</p>
          <div class="initials">
            <button class="init-cell" data-i="0" type="button">A</button>
            <button class="init-cell" data-i="1" type="button">A</button>
            <button class="init-cell" data-i="2" type="button">A</button>
          </div>
          <button id="btnSaveScore" class="btn primary" type="button">Save Score</button>
        </div>
        <div class="btn-row">
          <button id="btnAgain" class="btn primary" type="button">Run Again</button>
          <button id="btnMenu" class="btn ghost" type="button">Menu</button>
        </div>
      </div>
    </section>
  </div>
  <script src="js/art-init.js"></script>
  <script src="js/art-boy.js"></script>
  <script src="js/art-girl.js"></script>
  <script src="js/art-ball.js"></script>
  <script src="js/art-block.js"></script>
  <script src="js/art-car.js"></script>
  <script src="js/art-book.js"></script>
  <script src="js/art-marble.js"></script>
  <script src="js/art-duck.js"></script>
  <script>
    if (window.TPD_ASSETS) {
      const boy = document.querySelector('[data-char="boy"] img');
      const girl = document.querySelector('[data-char="girl"] img');
      if (boy && TPD_ASSETS.boy) boy.src = TPD_ASSETS.boy;
      if (girl && TPD_ASSETS.girl) girl.src = TPD_ASSETS.girl;
    }
  </script>
  <script src="js/game.js"></script>
</body>
</html>
